
services:
  redis:
    image: redis:7-alpine
    container_name: agentic_rag_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  rag-app:
    build: .
    container_name: agentic_rag_app
    restart: unless-stopped
    depends_on:
      - redis
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - STREAMLIT_SERVER_ENABLE_FILE_WATCHER=false
      - PYTHONUNBUFFERED=1
      - REDIS_URL=redis://redis:6379
    volumes:
      - qdrant_data:/app/local_qdrant
      - uploaded_docs:/app/uploaded_docs
      - cloned_repos:/app/cloned_repos

volumes:
  redis_data:
  qdrant_data:
  uploaded_docs:
  cloned_repos:
